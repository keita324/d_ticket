<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1a52"/>
      <stop offset=".7" stop-color="#4a2a6e"/>
      <stop offset="1" stop-color="#6e3a85"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset=".8" stop-color="#f5d98a"/>
      <stop offset="1" stop-color="#f5d98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="620" cy="110" r="90" fill="url(#moon)" opacity=".9"/>
  <circle cx="620" cy="110" r="48" fill="#fdeebc"/>
  <!-- 街並みのシルエット -->
  <g fill="#180b30">
    <rect x="0" y="330" width="90" height="120"/>
    <rect x="70" y="290" width="70" height="160"/>
    <rect x="130" y="350" width="100" height="100"/>
    <rect x="220" y="300" width="60" height="150"/>
    <rect x="270" y="340" width="90" height="110"/>
    <rect x="350" y="280" width="70" height="170"/>
    <rect x="410" y="330" width="100" height="120"/>
    <rect x="500" y="310" width="60" height="140"/>
    <rect x="550" y="350" width="90" height="100"/>
    <rect x="630" y="300" width="80" height="150"/>
    <rect x="700" y="340" width="100" height="110"/>
    <!-- 電柱 -->
    <rect x="455" y="200" width="6" height="140"/>
    <rect x="430" y="215" width="56" height="5"/>
  </g>
  <!-- 窓明かり -->
  <g fill="#f5c96a" opacity=".85">
    <rect x="85" y="310" width="10" height="12"/><rect x="105" y="340" width="10" height="12"/>
    <rect x="235" y="320" width="9" height="11"/><rect x="365" y="305" width="10" height="12"/>
    <rect x="385" y="335" width="10" height="12"/><rect x="515" y="330" width="9" height="11"/>
    <rect x="645" y="320" width="10" height="12"/><rect x="665" y="350" width="10" height="12"/>
  </g>
  <text x="400" y="180" text-anchor="middle" fill="#fff" font-size="56" font-weight="700" letter-spacing="8">影法師の街</text>
  <text x="400" y="218" text-anchor="middle" fill="#d9c5ec" font-size="16" letter-spacing="6">劇団ハナミズキ 再演</text>
</svg>
