<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee0ff"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa05a"/>
      <stop offset="1" stop-color="#1f7a40"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- フェアウェイ -->
  <path d="M0,300 C220,250 520,250 800,300 L800,450 L0,450 Z" fill="url(#green)"/>
  <path d="M0,320 C220,275 520,275 800,320" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="6"/>
  <!-- ピンフラッグ -->
  <g transform="translate(600,180)">
    <line x1="0" y1="0" x2="0" y2="150" stroke="#444" stroke-width="5"/>
    <polygon points="0,0 70,20 0,40" fill="#e3104a"/>
    <circle cx="0" cy="150" r="7" fill="#222"/>
  </g>
  <!-- ボール -->
  <circle cx="250" cy="350" r="22" fill="#fff" stroke="#cdd8d0" stroke-width="2"/>
  <g fill="#cdd8d0"><circle cx="244" cy="344" r="2"/><circle cx="256" cy="346" r="2"/><circle cx="250" cy="356" r="2"/></g>
  <text x="60" y="100" fill="#0e3d24" font-size="46" font-weight="700" letter-spacing="2">富士通レディース</text>
  <text x="62" y="150" fill="#1f7a40" font-size="40" font-weight="700" letter-spacing="6">2026</text>
</svg>
