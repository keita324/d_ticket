<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0a12"/>
      <stop offset=".55" stop-color="#7a0d22"/>
      <stop offset="1" stop-color="#1a0307"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#ffd27d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd27d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#spot)"/>
  <!-- スポットライト -->
  <g fill="#ffe8c2" fill-opacity=".10">
    <polygon points="400,0 250,450 550,450"/>
  </g>
  <!-- マイク -->
  <g transform="translate(400,250)" stroke="#ffd27d" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="0" y1="40" x2="0" y2="120"/>
    <circle cx="0" cy="10" r="34" fill="#ffd27d" fill-opacity=".15"/>
  </g>
  <text x="400" y="160" text-anchor="middle" fill="#fff" font-size="100" font-weight="700" letter-spacing="2">M-1</text>
  <text x="400" y="405" text-anchor="middle" fill="#ffe8c2" font-size="30" font-weight="700" letter-spacing="6">2025 スペシャルツアー</text>
</svg>
