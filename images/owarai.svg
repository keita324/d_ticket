  <text x="400" y="395" text-anchor="middle" fill="#fff" font-size="44" font-weight="700" letter-spacing="4">真夏のお笑いフェスタ</text>
  <text x="400" y="425" text-anchor="middle" fill="#ffe8c2" font-size="18" font-weight="500" letter-spacing="8">2026・人気芸人 総勢30組</text>
